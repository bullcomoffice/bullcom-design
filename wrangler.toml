name = "bullcom-design"
main = "worker.js"
compatibility_date = "2026-07-01"

# workers.dev も残す（本番ドメインが不調なときの退避先）
# ※ [assets] より前に置くこと。TOML はテーブル宣言以降が全てその配下になるため、
#   [assets] の後ろに書くと assets.workers_dev と解釈され
#   「Unexpected fields found in assets field」の警告が出て設定が効かない
workers_dev = true

# 静的エクスポートの出力フォルダ。Worker から env.ASSETS で参照する
[assets]
directory = "./out"
binding = "ASSETS"
# 既定ではアセットに一致するパスは Worker を通らずに配信される。それだと
# worker.js の URL正規化（対策台帳 A-1）が呼ばれず、末尾スラッシュはアセット層の
# 307 のまま、http/www も素通しになる。全リクエストを先に Worker へ渡す。
run_worker_first = true

# 本番ドメイン（bullcom.website / www）は Cloudflare ダッシュボードの
# Workers ルート → カスタムドメイン で登録している。
# ここに [[routes]] を書くと deploy 時にゾーン権限が要るが、現在の
# CLOUDFLARE_API_TOKEN はこのゾーンのルート操作を許可されていないため
# 「Authentication error [code: 10000]」で deploy ごと失敗する。書かないこと。
