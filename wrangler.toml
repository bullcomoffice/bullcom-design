name = "bullcom-design"
main = "worker.js"
compatibility_date = "2026-07-01"

# workers.dev も残す（本番ドメインが不調なときの退避先）
# ※ [assets] より前に置くこと。TOML はテーブル宣言以降が全てその配下になるため、
#   [assets] の後ろに書くと assets.workers_dev と解釈され
#   「Unexpected fields found in assets field」の警告が出て設定が効かない
workers_dev = true

# 静的エクスポートの出力フォルダ。Worker から env.ASSETS で参照する
[assets]
directory = "./out"
binding = "ASSETS"
# Worker を先に通すのは、ページ（HTML）とフォーム送信だけにする（bullcom.jp と同じ方式、2026-10-14）。
# - "/*" は残す。HTML のパスは今までどおり Worker を通るので、URL正規化（301/308）は維持される。
#   （true をやめて ["/api/*"] だけにすると、アセットに一致するページが Worker を通らず正規化が効かなくなる）
# - フォント・JS・CSS・先読み用の .txt・画像は Worker を通さず直接返す。
#   Worker を通したリクエストは無料枠（アカウント全体で1日10万件）に数えられ、上限を超えると429になる。
# - 存在しない .php や /wp-* を探すスキャンも、Worker を通さず404を返す。
# パターンの「*」は深い階層までマッチし、「!」付きが優先される。新しい種類のファイルを置いたら「!/*.拡張子」を足す。
run_worker_first = [
  "/*",
  "!/_next/*",
  "!/*.txt",
  "!/*.xml",
  "!/*.woff2",
  "!/*.css",
  "!/*.js",
  "!/*.png",
  "!/*.jpg",
  "!/*.jpeg",
  "!/*.webp",
  "!/*.svg",
  "!/*.ico",
  "!/*.gif",
  "!/blog-thumbnails/*",
  "!/*.php",
  "!/wp-*",
]

# 本番ドメイン（bullcom.website / www）は Cloudflare ダッシュボードの
# Workers ルート → カスタムドメイン で登録している。
# ここに [[routes]] を書くと deploy 時にゾーン権限が要るが、現在の
# CLOUDFLARE_API_TOKEN はこのゾーンのルート操作を許可されていないため
# 「Authentication error [code: 10000]」で deploy ごと失敗する。書かないこと。
